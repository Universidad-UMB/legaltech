                $ref: '#/components/schemas/Problem'
      parameters:
      - *id002
      security:
      - OpaqueBearer: []
components:
  securitySchemes:
    OpaqueBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token opaco 256-bit, SHA-256 en DB, revocable; sin JWT; cabecera Authorization. No usar cookies
        en DEMO.
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 0
        request_id:
          type: string
          minLength: 1
          format: uuid
        instance:
          type: string
          minLength: 0
      required:
      - type
      - title
      - status
      - request_id
      description: RFC 9457, sin datos de otros clientes ni secretos
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - username
      - password
    SessionCreated:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 32
        token_type:
          type: string
          minLength: 1
          enum:
          - Bearer
        expires_at:
          type: string
          minLength: 1
          format: date-time
      required:
      - access_token
      - token_type
      - expires_at
    Principal:
      type: object
      additionalProperties: false
      properties:
        account_id:
          type: string
          minLength: 1
          format: uuid
        person_id:
          type: string
          minLength: 1
          format: uuid
        account_kind:
          type: string
          minLength: 1
          enum:
          - INTERNAL
          - EXTERNAL
        client_id:
          oneOf:
          - type: string
            minLength: 1
            format: uuid
          - type: 'null'
        roles:
          type: array
          items:
            type: string
            minLength: 1
            enum:
            - ADMIN
            - ANALYST
            - LAWYER
            - PREPARER
            - COORDINATOR
            - EXTERNAL_READER
      required:
      - account_id
      - person_id
      - account_kind
      - client_id
      - roles
    ClientCreate:
      type: object
      additionalProperties: false
      properties:
        client_code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 180
      required:
      - client_code
      - name
    Client:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        client_code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
          enum:
          - ACTIVE
          - SUSPENDED
      required:
      - id
      - client_code
      - name
      - status
    ProcessCreate:
      type: object
      additionalProperties: false
      properties:
        radicado:
          type: string
          minLength: 23
          maxLength: 23
          pattern: ^[0-9]{23}$
        label:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 180
          - type: 'null'
      required:
      - radicado
    Process:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        radicado:
          type: string
          minLength: 23
          maxLength: 23
          pattern: ^[0-9]{23}$
        label:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 180
          - type: 'null'
      required:
      - id
      - radicado
      - label
    TrackingCreate:
      type: object
      additionalProperties: false
      properties:
        client_id:
          type: string
          minLength: 1
          format: uuid
        process_id:
          type: string
          minLength: 1
          format: uuid
      required:
      - client_id
      - process_id
    Tracking:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        tracking_code:
          type: string
          minLength: 1
        client_id:
          type: string
          minLength: 1
          format: uuid
        process_id:
          type: string
          minLength: 1
          format: uuid
        status:
          type: string
          minLength: 1
          enum:
          - PENDING
          - ACTIVE
          - FINISHED
        baseline_observation_id:
          oneOf:
          - type: string
            minLength: 1
            format: uuid
          - type: 'null'
        last_adopted_observation_id:
          oneOf:
          - type: string
            minLength: 1
            format: uuid
          - type: 'null'
      required:
      - id
      - tracking_code
      - client_id
      - process_id
      - status
      - baseline_observation_id
      - last_adopted_observation_id
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 8
          maxLength: 1000
      required:
      - reason
    AcquisitionCreate:
      type: object
      additionalProperties: false
      properties:
        process_id:
          type: string
          minLength: 1
          format: uuid
        fixture_code:
          type: string
          minLength: 1
          enum:
          - OBS_001
          - OBS_002
          - FAILED
          - INCOMPLETE
        request_key:
          type: string
          minLength: 8
          maxLength: 100
      required:
      - process_id
      - fixture_code
      - request_key
    Acquisition:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        process_id:
          type: string
          minLength: 1
          format: uuid
        source_code:
          type: string
          minLength: 1
          enum:
          - DEMO-FIXTURE
        status:
          type: string
          minLength: 1
          enum:
          - PENDING
          - SUCCESS
          - INCOMPLETE
          - FAILED
        request_key:
          type: string
          minLength: 1
        observation_id:
          oneOf:
          - type: string
            minLength: 1
            format: uuid
          - type: 'null'
        error_code:
          oneOf:
          - type: string
            minLength: 1
          - type: 'null'
        coverage_note:
          oneOf:
          - type: string
            minLength: 0
          - type: 'null'
      required:
      - id
      - process_id
      - source_code
      - status
      - request_key
      - observation_id
      - error_code
      - coverage_note
    ObservedAction:
      type: object
      additionalProperties: false
      properties:
        action_key:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        occurred_on:
          oneOf:
          - type: string
            minLength: 1
            format: date
          - type: 'null'
      required:
      - action_key
      - description
      - occurred_on
    Observation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        process_id:
          type: string
          minLength: 1
          format: uuid
        quality:
          type: string
          minLength: 1
          enum:
          - COMPARABLE
          - INCOMPLETE
          - INDETERMINATE
        sealed:
          type: boolean
        observed_at:
          type: string
          minLength: 1
          format: date-time
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ObservedAction'
        coverage_note:
          oneOf:
          - type: string
            minLength: 0
          - type: 'null'
      required:
      - id
      - process_id
      - quality
      - sealed
      - observed_at
      - actions
      - coverage_note
    AdoptObservationRequest:
      type: object
      additionalProperties: false
      properties:
        observation_id:
          type: string
          minLength: 1
          format: uuid
      required:
      - observation_id
    AdoptionResult:
      type: object
      additionalProperties: false
      properties:
        tracking:
          $ref: '#/components/schemas/Tracking'
        outcome:
          type: string
          minLength: 1
          enum:
          - BASELINE_SET
          - ADVANCED
          - ALREADY_ADOPTED
      required:
      - tracking
      - outcome
    ComparisonCreate:
      type: object
      additionalProperties: false
      properties:
        old_observation_id:
          type: string
          minLength: 1
          format: uuid
        new_observation_id:
          type: string
          minLength: 1
          format: uuid
        rule_version:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - old_observation_id
      - new_observation_id
      - rule_version
    TechnicalChange:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        action_key:
          type: string
          minLength: 1
        change_kind:
          type: string
          minLength: 1
          enum:
          - ADDED
        evidence:
          type: string
          minLength: 1
      required:
      - id
      - action_key
      - change_kind
      - evidence
    Comparison:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        process_id:
          type: string
          minLength: 1
          format: uuid
        old_observation_id:
          type: string
          minLength: 1
          format: uuid
        new_observation_id:
          type: string
          minLength: 1
          format: uuid
        rule_version:
          type: string
          minLength: 1
        result:
          type: string
          minLength: 1
          enum:
          - CHANGES_FOUND
          - NO_CHANGES
          - NOT_COMPARABLE
        changes:
          type: array
          items:
            $ref: '#/components/schemas/TechnicalChange'
      required:
      - id
      - process_id
      - old_observation_id
      - new_observation_id
      - rule_version
      - result
      - changes
    EvaluationCreate:
      type: object
      additionalProperties: false
      properties:
        comparison_id:
          type: string
          minLength: 1
          format: uuid
      required:
      - comparison_id
    Evaluation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        tracking_id:
          type: string
          minLength: 1
          format: uuid
        comparison_id:
          type: string
          minLength: 1
          format: uuid
        decision:
          type: string
          minLength: 1
          enum:
          - ELIGIBLE
          - SKIPPED
        reason:
          type: string
          minLength: 1
        novelty_ids:
          type: array
          items:
            type: string
            minLength: 1
            format: uuid
      required:
      - id
      - tracking_id
      - comparison_id
      - decision
      - reason
      - novelty_ids
    Novelty:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        novelty_code:
          type: string
          minLength: 1
        tracking_id:
          type: string
          minLength: 1
          format: uuid
        status:
          type: string
          minLength: 1
          enum:
          - PENDING_OPERATIVE
          - IN_OPERATIVE_REVIEW
          - PENDING_LEGAL
          - TREATMENT_DEFINED
          - IN_FOLLOWUP
          - DISCARDED
        change_id:
          type: string
          minLength: 1
          format: uuid
      required:
      - id
      - novelty_code
      - tracking_id
      - status
      - change_id
    OperativeEscalation:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          minLength: 8
          maxLength: 2000
        evidence_note:
          type: string
          minLength: 8
          maxLength: 2000
      required:
      - decision
      - evidence_note
    LegalReview:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          minLength: 8
          maxLength: 2000
        evidence_note:
          type: string
          minLength: 8
          maxLength: 2000
      required:
      - decision
      - evidence_note
    PublicationCreate:
      type: object
      additionalProperties: false
      properties:
        tracking_id:
          type: string
          minLength: 1
          format: uuid
        novelty_ids:
          type: array
          items:
            type: string
            minLength: 1
            format: uuid
        content_text:
          type: string
          minLength: 10
          maxLength: 10000
      required:
      - tracking_id
      - novelty_ids
      - content_text
    VersionCreate:
      type: object
      additionalProperties: false
      properties:
        novelty_ids:
          type: array
          items:
            type: string
            minLength: 1
            format: uuid
        content_text:
          type: string
          minLength: 10
          maxLength: 10000
      required:
      - novelty_ids
      - content_text
    Publication:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        tracking_id:
          type: string
          minLength: 1
          format: uuid
        client_id:
          type: string
          minLength: 1
          format: uuid
        current_version_id:
          oneOf:
          - type: string
            minLength: 1
            format: uuid
          - type: 'null'
        versions:
          type: array
          items:
            type: string
            minLength: 1
            format: uuid
      required:
      - id
      - tracking_id
      - client_id
      - current_version_id
      - versions
    PublicationVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        publication_id:
          type: string
          minLength: 1
          format: uuid
        version_number:
          type: integer
          minimum: 1
        recipient_tracking_id:
          type: string
          minLength: 1
          format: uuid
        recipient_client_id:
          type: string
          minLength: 1
          format: uuid
        status:
          type: string
          minLength: 1
          enum:
          - DRAFT
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
          - PUBLISHED
        content_text:
          type: string
          minLength: 1
        content_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        frozen_at:
          oneOf:
          - type: string
            minLength: 1
            format: date-time
          - type: 'null'
        approved_at:
          oneOf:
          - type: string
            minLength: 1
            format: date-time
          - type: 'null'
        published_at:
          oneOf:
          - type: string
            minLength: 1
            format: date-time
          - type: 'null'
      required:
      - id
      - publication_id
      - version_number
      - recipient_tracking_id
      - recipient_client_id
      - status
      - content_text
      - content_sha256
      - frozen_at
      - approved_at
      - published_at
    ApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        verdict:
          type: string
          minLength: 1
          enum:
          - APPROVE
          - REJECT
        justification:
          type: string
          minLength: 8
          maxLength: 2000
      required:
      - verdict
      - justification
    PortalTracking:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          format: uuid
        tracking_code:
          type: string
          minLength: 1
        has_publication:
          type: boolean
        coverage_status:
          type: string
          minLength: 1
          enum:
          - COMPARABLE
          - INCOMPLETE
          - FAILED
          - NOT_OBSERVED
        radicado:
          type: string
          minLength: 23
          maxLength: 23
          pattern: ^[0-9]{23}$
      required:
      - id
      - tracking_code
      - radicado
      - has_publication
      - coverage_status
    PortalTrackingList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalTracking'
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
          - type: 'null'
      required:
      - items
      - next_cursor
    PortalPublication:
      type: object
      additionalProperties: false
      properties:
        version_id:
          type: string
          minLength: 1
          format: uuid
        published_at:
          type: string
          minLength: 1
          format: date-time
        content_text:
          type: string
          minLength: 1
      required:
      - version_id
      - published_at
      - content_text
    PortalPublicationResult:
      type: object
      additionalProperties: false
      properties:
        available:
          type: boolean
        coverage_status:
          type: string
          minLength: 1
          enum:
          - COMPARABLE
          - INCOMPLETE
          - FAILED
          - NOT_OBSERVED
        publication:
          oneOf:
          - $ref: '#/components/schemas/PortalPublication'
          - type: 'null'
      required:
      - available
      - coverage_status
      - publication
      description: El valor available=false es válido únicamente para seguimientos autorizados, no revela recursos
        ajenos
    NoveltyList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Novelty'
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
          - type: 'null'
      required:
      - items
      - next_cursor
