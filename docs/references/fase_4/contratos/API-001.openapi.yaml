openapi: 3.1.1
info:
  title: LegalTech Vigilancia Judicial — Backend DEMO
  version: 0.1.0-design
  description: CONTRATO CANDIDATO, no implementado. Información ficticia y sin acceso a sistemas judiciales reales.
    Ver API-001, SEC-001 y DEC-F4-001.
servers:
- url: http://localhost:8000
  description: Únicamente desarrollo local; TLS obligatorio fuera de localhost
tags:
- name: Public
  description: Endpoint de salud sin acceso a dominio
- name: Auth
  description: Autenticación local de demo
- name: Internal
  description: Operaciones internas sujetas a asignación y estado
- name: Portal
  description: Consulta externa estrictamente acotada al seguimiento
paths:
  /healthz:
    get:
      tags:
      - Public
      operationId: healthz
      summary: Salud del proceso de API
      description: No revela información de clientes. HTTP 200 si el proceso sirve HTTP; no garantiza salud DB.
      responses:
        '200':
          description: Operación completada
      security: []
  /api/v1/auth/sessions:
    post:
      tags:
      - Auth
      operationId: login
      summary: Autenticar y crear sesión revocable
      description: Credenciales inválidas responden 401 genérico. Expiración absoluta de 60 minutos; token opaco
        sólo en esta respuesta y nunca en logs.
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
          headers:
            Location:
              schema:
                type: string
                minLength: 1
              description: Ruta del recurso creado
        '401':
          description: Autenticación requerida o inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validación semántica fallida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Demasiadas solicitudes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /api/v1/auth/sessions/current:
    delete:
      tags:
      - Auth
      operationId: logout
      summary: Revocar sesión actual
      description: 'Revoca token si sigue vigente. Reintentos con token válido: 204; token ya revocado: 401.'
      responses:
        '204':
          description: Sin contenido
        '401':
          description: Autenticación requerida o inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - OpaqueBearer: []
  /api/v1/auth/me:
    get:
      tags:
